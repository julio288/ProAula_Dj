spring.application.name=registro-login
spring.config.import=optional:file:.env[.properties]
app.jwt.secret=${JWT_SECRET:}

# --- MySQL / XAMPP ---
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/universidad}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# --- Thymeleaf ---
spring.thymeleaf.cache=false

# --- Logging útil en desarrollo ---
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG

# --- port ---
server.port=${PORT:8080}

# --- Network monitoring ---
# MONITORING_TARGETS format: name|host|port|TCP|description;name|host|port|TCP|description
monitoring.targets=${MONITORING_TARGETS:}
monitoring.poll-interval=${MONITORING_POLL_INTERVAL:30s}
monitoring.connect-timeout=${MONITORING_CONNECT_TIMEOUT:2s}
monitoring.initial-delay=${MONITORING_INITIAL_DELAY:1s}
monitoring.windows-event-log-enabled=${MONITORING_WINDOWS_EVENT_LOG_ENABLED:true}
monitoring.windows-event-log-channels=${MONITORING_WINDOWS_EVENT_LOG_CHANNELS:System,Application,Security}
